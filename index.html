<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat Ball</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      outline: none;
    }

    .game-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .game-subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    /* Menú vertical */
    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .menu-item {
      background: #0f172a;
      border: 2px solid #334155;
      color: #94a3b8;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    .menu-item.active, .menu-item:focus {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      transform: scale(1.02);
    }

    .game-status {
      display: none;
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #38bdf8;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <main id="app-container" role="application" aria-label="Beat Ball" tabindex="0" class="game-card">
    
    <h1 class="game-title">Beat Ball</h1>
    <p class="game-subtitle">Audiojuego de Penaltis</p>

    <!-- Menú accesibles con roles de menú/opciones para lectura nativa -->
    <div id="menu" class="menu-container" role="menu" aria-label="Menú principal">
      <button class="menu-item active" role="menuitem" tabindex="0" data-action="play">Jugar Partido</button>
      <button class="menu-item" role="menuitem" tabindex="-1" data-action="exit">Salir del Juego</button>
    </div>

    <div id="status-display" class="game-status">¡Partido en Curso!</div>

    <!-- Anunciador de estado solo para cuando cambia la navegación del menú -->
    <div id="screen-reader-announcer" class="sr-only" aria-live="polite"></div>

  </main>

  <script src="renderer.js"></script>
</body>
</html>
